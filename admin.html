<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户管理 - AI机器人·成长营</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .admin-header {
            background: linear-gradient(135deg, #1a2a6c 0%, #2d4a9e 100%);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }
        .admin-header h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .admin-header p { font-size: 0.9rem; opacity: 0.85; }
        .admin-back {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .admin-back:hover { opacity: 1; }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--paper);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .num {
            font-size: 2rem;
            font-weight: 700;
            color: var(--robot-blue);
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #7a6a5a;
            margin-top: 4px;
        }
        .stat-card.active .num { color: var(--robot-green); }
        .stat-card.pending .num { color: #e67e22; }
        .user-table {
            background: var(--paper);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .user-table-header {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 0.8fr 100px 120px 160px;
            padding: 12px 16px;
            background: #f0ede4;
            font-weight: 600;
            font-size: 0.85rem;
            color: #5a4a3a;
        }
        .user-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 0.8fr 100px 120px 160px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0ede4;
            align-items: center;
            font-size: 0.9rem;
        }
        .user-row:last-child { border-bottom: none; }
        .user-row:hover { background: #faf8f2; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-badge.admin {
            background: #d1ecf1;
            color: #0c5460;
        }
        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-right: 4px;
            transition: all 0.2s;
        }
        .action-btn.activate {
            background: var(--robot-green);
            color: #fff;
        }
        .action-btn.activate:hover { background: #4a9e4a; }
        .action-btn.deactivate {
            background: #e67e22;
            color: #fff;
        }
        .action-btn.deactivate:hover { background: #d35400; }
        .action-btn.delete {
            background: #e74c3c;
            color: #fff;
        }
        .action-btn.delete:hover { background: #c0392b; }
        .no-users {
            text-align: center;
            padding: 40px;
            color: #7a6a5a;
        }
        .admin-login {
            max-width: 400px;
            margin: 60px auto;
            background: var(--paper);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .admin-login h2 {
            color: var(--robot-blue);
            margin-bottom: 16px;
        }
        .admin-login input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .admin-login button {
            width: 100%;
            padding: 12px;
            background: var(--robot-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .admin-login button:hover { background: #3a7bc8; }
        .admin-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #e74c3c;
        }
        @media (max-width: 768px) {
            .admin-stats { grid-template-columns: 1fr; }
            .user-table-header, .user-row {
                grid-template-columns: 1fr 80px 120px;
            }
            .user-table-header > :nth-child(2),
            .user-row > :nth-child(2),
            .user-table-header > :nth-child(4),
            .user-row > :nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <a href="index.html" class="admin-back">← 返回首页</a>
        <h1>👥 用户管理</h1>
        <p>AI机器人·成长营 管理后台</p>
    </div>

    <div class="admin-container" id="adminContent">
        <!-- 动态渲染 -->
    </div>

    <script src="js/auth.js?v=9"></script>
    <script>
    (function() {
        const container = document.getElementById('adminContent');

        function renderLogin() {
            container.innerHTML = `
                <div class="admin-login">
                    <h2>🔐 管理员登录</h2>
                    <input type="text" id="adminUser" placeholder="管理员账号" />
                    <input type="password" id="adminPass" placeholder="密码" />
                    <button id="adminLoginBtn">登 录</button>
                    <div class="admin-msg" id="adminMsg"></div>
                </div>
            `;
            document.getElementById('adminLoginBtn').addEventListener('click', function() {
                const u = document.getElementById('adminUser').value.trim();
                const p = document.getElementById('adminPass').value;
                const msg = document.getElementById('adminMsg');
                AuthManager.login(u, p).then(function(result) {
                    if (result.success) {
                        if (AuthManager.isAdmin()) {
                            renderDashboard();
                        } else {
                            msg.textContent = '❌ 该账号不是管理员';
                            AuthManager.logout();
                        }
                    } else {
                        msg.textContent = '❌ ' + result.message;
                    }
                }).catch(function() {
                    msg.textContent = '❌ 网络错误，请重试';
                });
            });
        }

        function renderDashboard() {
            AuthManager.getAllUsers().then(function(result) {
                if (!result.success) {
                    renderLogin();
                    return;
                }
                const users = result.users;
                const total = users.length;
                const active = users.filter(u => u.active).length;
                const pending = total - active;

                let userRows = '';
                users.forEach(u => {
                    const isAdm = u.role === 'admin';
                    const statusClass = isAdm ? 'admin' : (u.active ? 'active' : 'pending');
                    const statusText = isAdm ? '管理员' : (u.active ? '已激活' : '待激活');
                    const created = u.createdAt ? new Date(u.createdAt).toLocaleDateString('zh-CN') : '-';
                    const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleString('zh-CN') : '从未登录';
                    const realName = u.realName || '-';
                    const gender = u.gender || '-';
                    const school = u.school || '-';
                    const grade = u.grade || '-';
                    const phone = u.phone || '-';
                    const email = u.email || '-';

                    let actions = '';
                    if (!isAdm) {
                        if (u.active) {
                            actions = `<button class="action-btn deactivate" onclick="deactivateUser('${u.username}')">停用</button>`;
                        } else {
                            actions = `<button class="action-btn activate" onclick="activateUser('${u.username}')">激活</button>`;
                        }
                        actions += `<button class="action-btn delete" onclick="deleteUser('${u.username}')">删除</button>`;
                    }

                    userRows += `
                        <div class="user-row">
                            <div><strong>${u.nickname}</strong><br/><small style="color:#999;">@${u.username}</small></div>
                            <div><small>${realName}</small><br/><small style="color:#999;">${gender}</small></div>
                            <div><small>${school}</small><br/><small style="color:#999;">${grade}</small></div>
                            <div><small>${phone}</small><br/><small style="color:#999;">${email}</small></div>
                            <div><small>${lastLogin}</small></div>
                            <div><span class="status-badge ${statusClass}">${statusText}</span></div>
                            <div>${actions}</div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="admin-stats">
                        <div class="stat-card">
                            <div class="num">${total}</div>
                            <div class="label">总用户数</div>
                        </div>
                        <div class="stat-card active">
                            <div class="num">${active}</div>
                            <div class="label">已激活</div>
                        </div>
                        <div class="stat-card pending">
                            <div class="num">${pending}</div>
                            <div class="label">待激活</div>
                        </div>
                    </div>
                    <div class="user-table">
                        <div class="user-table-header">
                            <div>用户</div>
                            <div>姓名/性别</div>
                            <div>学校/年级</div>
                            <div>联系方式</div>
                            <div>最近登录</div>
                            <div>状态</div>
                            <div>操作</div>
                        </div>
                        ${userRows || '<div class="no-users">暂无注册用户</div>'}
                    </div>
                `;
            }).catch(function() {
                container.innerHTML = '<div class="no-users">❌ 网络错误，请刷新重试</div>';
            });
        }

        // 全局函数
        window.activateUser = function(username) {
            AuthManager.activateUser(username).then(function(result) {
                if (result.success) {
                    renderDashboard();
                } else {
                    alert(result.message);
                }
            });
        };

        window.deactivateUser = function(username) {
            if (!confirm('确定要停用该用户吗？')) return;
            AuthManager.deactivateUser(username).then(function(result) {
                if (result.success) {
                    renderDashboard();
                } else {
                    alert(result.message);
                }
            });
        };

        window.deleteUser = function(username) {
            if (!confirm('确定要删除该用户吗？此操作不可恢复！')) return;
            AuthManager.deleteUser(username).then(function(result) {
                if (result.success) {
                    renderDashboard();
                } else {
                    alert(result.message);
                }
            });
        };

        // 入口
        if (AuthManager.isLoggedIn() && AuthManager.isAdmin()) {
            renderDashboard();
        } else {
            renderLogin();
        }
    })();
    </script>
</body>
</html>
